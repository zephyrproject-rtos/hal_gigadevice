# GD32F303XX pin definitions
#
# Sources:
# - GD32F303xB Datasheet (Revision 1.1)
# - GD32F303XX Datasheet (Revision 3.3)
# - GD32F30X User Manual (Revision 3.4)
#
# Pin codes:
#
# - 144 pins: Z
# - 100 pins: V
# - 64 pins:  R
# - 48 pins:  C
#
# Memory codes:
#
# - 3072Kb Flash, 96Kb SRAM: K
# - 2048Kb Flash, 96Kb SRAM: I
# - 1024Kb Flash, 96Kb SRAM: G
# - 512Kb  Flash, 96Kb SRAM: E
# - 256Kb  Flash, 48Kb SRAM: C
# - 128Kb  Flash, 32Kb SRAM: B
#
